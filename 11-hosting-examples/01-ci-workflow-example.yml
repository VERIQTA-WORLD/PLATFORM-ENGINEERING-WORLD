name: Validate Platform Engineering World
on: [push, pull_request]
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python 06-tools/05-check-all.py
      - run: python 06-tools/06-foundation-smoke.py
